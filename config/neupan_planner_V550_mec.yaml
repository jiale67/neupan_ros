# wheeltec V550_mec（麦轮全向）NeuPAN 规划器配置
#
# DUNE 权重 model/pretrain_V550_mec/model_5000.pth 按 robot.length/width 训练。
# 修改尺寸后必须用 NeuPAN/example/dune_train/dune_train_V550_mec.py 重训，
# 旧权重会正常加载但碰撞距离错误，不报错。

# mpc
receding: 5
step_time: 0.3
ref_speed: 0.3
device: 'cpu'
# min_distance 低于此值时停车 (m)
collision_threshold: 0.02

# robot
robot:
  # omni3: u = (vx, vy, w)，vx/vy 为世界系平移速度，w 为角速度，车头朝向由 MPC 优化
  kinematics: 'omni3'

  # omni3 需三个元素:
  #   [0] 平移速度/加速度模长上限 (m/s, m/s^2)
  #   [1] 不使用，仅保持接口形状
  #   [2] 角速度/角加速度上限 (rad/s, rad/s^2)
  max_speed: [1.0, 1.0, 1.0]
  max_acce: [1.0, 1.0, 2.0]

  # 横移代价 / 前进代价，实际权重 = lateral_ratio * adjust.p_u
  lateral_ratio: 0.2

  # 车体矩形以 base_link 为中心对称，取 urdf 包络的 2*max(|min|,|max|)
  # 包络 x[-0.1300, 0.1232]  y[-0.1223, 0.1223]（含车轮）
  length: 0.26
  width: 0.2446

# initial path
ipath:
  interval: 0.09
  waypoints: [[0, 0, 0], [5, 0, 0]]
  curve_style: 'line'
  min_radius: 0.0
  loop: False
  # 到达判定: 距终点 < arrive_threshold (m) 且参考点索引接近路径末端
  arrive_threshold: 0.05
  close_threshold: 0.1
  arrive_index_threshold: 1

  # 朝向参考来源（仅 omni3）:
  #   path -> 全局路径方向
  #   plan -> 当前规划轨迹的行进方向，绕障时车头随轨迹转
  heading_ref: 'plan'

  # plan 模式下速度低于此值 (m/s) 时退回路径方向
  heading_speed_threshold: 0.02

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  # 状态跟踪权重，标量或 [qx, qy, qtheta]；初始化后类型不能切换
  q_s: 0.3
  p_u: 2.5
  eta: 10.0
  d_max: 0.15
  d_min: 0.01
