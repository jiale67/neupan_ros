neupan_node:
  ros__parameters:

    # ---------- CPU ----------
    # NeuPAN 线程绑定的核，"4,5" / "3-5"，"" 不绑。其余核留给 EKF、底盘、雷达驱动
    cpu_affinity: "4,5"
    # torch / OpenMP / BLAS 线程数，0 = 绑定的核数
    num_threads: 0
    # 进程 nice 值 0~19，0 = 不改
    nice: 10
    # 控制频率 Hz。单次规划约 45~65 ms，20 Hz 无余量；增加核数不提速
    control_frequency: 10.0

    # ---------- 规划器 ----------
    # 相对路径按 neupan_ros 的 share 目录解析
    config_file: config/neupan_planner_V550_mec.yaml
    # 按车体尺寸训练，换车需重训
    dune_checkpoint: model/pretrain_V550_mec/model_5000.pth
    # 覆盖规划器 ipath.loop，"" 沿用规划器 yaml。必须 false，否则到达后往返不停
    loop: false

    # ---------- 话题 ----------
    scan_topic: /scan
    # 车体系 linear.x / linear.y / angular.z
    cmd_vel_topic: /cmd_vel
    # rviz2 2D Goal Pose
    goal_topic: /goal_pose

    # ---------- 坐标系 ----------
    # EKF world_frame，目标点在此坐标系下解释
    map_frame: odom_combined
    base_frame: base_footprint
    lidar_frame: laser

    # ---------- scan ----------
    # 量程 [min, max] m，与驱动 range_min/range_max 取交集
    scan_range: [0.0, 8.0]
    # 角度范围 [min, max] rad，雷达系
    scan_angle_range: [-3.15, 3.15]
    # 每 N 束取一束
    scan_downsample: 2
    # 扫描角反向（雷达倒装）
    flip_angle: false
    # scan 超时 s：规划中超时发零速度，超时也拒绝新目标点。<=0 关闭
    scan_timeout: 0.5

    # ---------- 目标点 ----------
    # 最大目标距离 m，<=0 不限制
    max_goal_distance: 10.0

    # ---------- 底盘执行延迟补偿 ----------
    # true: 用最近 cmd_delay 秒内已发的 cmd_vel 前推测量位姿，再交给规划器
    cmd_delay_compensation: true
    # 底盘纯延迟 s。V550 实测 vx 0.4、vy 0.7、w 0.7~1.4；换车或换固件需重测
    cmd_delay: 1.0

    # ---------- 可视化 ----------
    marker_size: 0.05
    marker_z: 0.3
