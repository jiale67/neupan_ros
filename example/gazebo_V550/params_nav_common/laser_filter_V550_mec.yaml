# V550_mec 激光雷达滤波链，剔除打在车体自身上的点。
#
# 为什么需要：雷达装在 base_link 前方 x=0.0835，车体一直延伸到 x=-0.13，
# 后半边有几段射线会打在自己车身上。实测 base_link 系下的自遮挡角度：
#   ±92~96°     0.05~0.08m
#   ±142~147°   0.11~0.15m
#   170~180°    0.10~0.22m   （正后方，车体后壁在雷达外 0.214m）
#
# 为什么不用 LaserScanRangeFilter 一刀切：
# 各方向车体边界到雷达的距离差很多（实测/几何计算）：
#   正前   0.0400 m      <- 最近
#   正左右 0.0780 m
#   左后45 0.1105 m
#   正后   0.2140 m      <- 最远
# 要靠 min_range 把正后方 0.214m 滤干净就得设 0.23，但那样车头前方
# 0.23-0.0397=0.190m 的真实障碍物会一起被扔掉。V550 车头外沿在 x=0.1232，
# 也就是贴着车头 19cm 内的东西全看不见，撞上了都不知道。
#
# 用 LaserScanBoxFilter：框就是车体轮廓，按 base_link 系剔除框内的点。
# 哪个方向车体伸多远就剔多远，其他方向的近处障碍物一点不损失。
#
# 框的尺寸不是按整车包围盒定的，是按【雷达高度处的车体截面】定的。
# 整车包围盒 x[-0.1300, 0.1232] y[±0.0778]，但那是整个底盘从底到顶的最大轮廓。
# 雷达在 z=0.0965，只有这个高度上的车体才会挡光。实测 base_link.STL 在
# z=0.0965 处的截面：
#   x[-0.1268, 0.0959]  y[±0.0755]
# 前沿只到 0.0959，而雷达自己在 0.0835，几乎齐平——这就是为什么实测前向
# 一个自遮挡点都没有。按整车包围盒的 0.1232 设框会白剔 2.7cm。
#
# 余量取 0.03m = 3 sigma 噪声。ray 传感器 stddev=0.01，车体点的测距值会在真实
# 边界附近正负抖动，抖出框外就漏。第一版只给了 5mm 余量（0.5 sigma），单条射线
# 理论泄漏率 31%，实测 16 个自遮挡角度里漏了 3 个，对得上。
#   余量 0.005 (0.5σ) -> 泄漏 30.85%
#   余量 0.010 (1.0σ) -> 泄漏 15.87%
#   余量 0.020 (2.0σ) -> 泄漏  2.28%
#   余量 0.030 (3.0σ) -> 泄漏  0.13%   <- 取这个
#
# 所以框 = 截面 + 0.03：
#   x[-0.1570, 0.1260]  y[±0.1055]
#
# 加了 3cm 余量后仍然不损失近处障碍物，三个方向分别看：
#   前向: 框前边界 0.1260，在雷达外 0.1260-0.0835=0.0425m，而 range_min 本来
#         就是 0.05m。框整个躲在 range_min 里面，等于没起作用，前向零损失。
#   侧向: 框到 y=±0.1055，但车轮外沿在 y=±0.125（costmap footprint 也是这个数）。
#         框比车轮还窄，剔掉的区域本来就在轮子底下，不可能有能撞到的障碍物。
#   后向: 框到 x=-0.157，footprint 后沿 -0.133，多剔 2.4cm。这是唯一的实际损失。
#         考虑 inflation_radius=0.25，规划器本来就要求离障碍物 25cm，2.4cm 无影响。
#
# 不用管车轮进不进框：雷达在 z=0.0965，车轮顶只到 0.0167+0.0372=0.0539，
# 扫描平面在车轮上方，车轮根本不进扫描。
#
# z 给 [-0.1, 0.3]：2D 扫描所有点都在 z=0.0965 这一个平面上，z 不区分任何
# 东西，给个宽范围保证不会因为浮点或 TF 抖动漏掉点。

scan_filter_chain:
  - name: body_removal
    type: laser_filters/LaserScanBoxFilter
    params:
      # 按 base_link 剔除，不是 laser_link。laser_link 系带 yaw=-π，用它写框容易
      # 搞反方向；base_link 系的 x 就是车头方向，跟上面的包围盒数字直接对应。
      # TF base_link->laser_link 由 robot_state_publisher 提供。
      box_frame: base_link
      min_x: -0.1570
      max_x:  0.1260
      min_y: -0.1055
      max_y:  0.1055
      min_z: -0.1000
      max_z:  0.3000
      # false = 剔除框内的点（保留框外）。true 是反过来只留框内，不要设错。
      invert: false
